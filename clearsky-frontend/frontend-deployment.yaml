apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: clearsky-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000 # Changed to match Dockerfile EXPOSE
          readinessProbe:
            httpGet:
              path: /
              port: 3000 # Changed to match Dockerfile EXPOSE
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000 # Changed to match Dockerfile EXPOSE
            initialDelaySeconds: 15
            periodSeconds: 20