apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80        # Internal port for the service (can remain 80 or be changed)
      targetPort: 80   # Changed to match the containerPort
      nodePort: 30000  # Port exposed on the Node