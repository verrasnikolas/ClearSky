apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-excel-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-excel-service
  template:
    metadata:
      labels:
        app: upload-excel-service
    spec:
      containers:
        - name: upload-excel-container
          image: upload-excel-image:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006