apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
    spec:
      containers:
        - name: upload-container
          image: upload-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3006
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: JWT_SECRET
              value: "super_secret"
            - name: TOKEN_EXPIRY
              value: "1h"
            - name: REFRESH_TOKEN_SECRET
              value: "refresh_secret"

