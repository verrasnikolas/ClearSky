apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  type: NodePort
  selector:
    app: upload-service
  ports:
    - protocol: TCP
      port: 3006 # Internal port for the service
      targetPort: 3006 # Port the container is listening on
      nodePort: 30036 # Port exposed on the Node (if using NodePort)