apiVersion: batch/v1
kind: Job
metadata:
  name: stats-db-migrate # Name for your migration job
spec:
  template:
    spec:
      containers:
        - name: migrate
          # Use the same image as your grades-service, as it should contain your code,
          # dependencies (including sequelize-cli), and migration files.
          image: jimkam5/saas:latest
          imagePullPolicy: Never # Or 'IfNotPresent' if you prefer
          command: ["npx"]
          args: ["sequelize-cli", "db:migrate"] # The command to run your migrations

          # Pass the database connection details as environment variables.
          # These must match what your application expects and how your postgres service is named.
          env:
            - name: DB_HOST
              value: stats-db # This is the name of your Kubernetes Service for Postgres
            - name: DB_NAME
              value: "stats_db"
            - name: DB_USER
              value: stats_user
            - name: DB_PASSWORD
              value: "1234" # Replace with a Kubernetes Secret reference in production!
            - name: DB_PORT
              value: "5432"

      # Jobs are designed to run to completion, so restartPolicy should be Never
      restartPolicy: Never
  # Optional: Configure retries if the job fails
  backoffLimit: 3 # Retry the job up to 3 times on failure