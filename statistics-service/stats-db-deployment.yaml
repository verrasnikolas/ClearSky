apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-db
  template:
    metadata:
      labels:
        app: stats-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "stats_db"
            - name: POSTGRES_USER
              value: "stats_user"
            - name: POSTGRES_PASSWORD
              value: "1234"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: stats-db-storage
      volumes:
        - name: stats-db-storage
          persistentVolumeClaim:
            claimName: stats-db-pvc