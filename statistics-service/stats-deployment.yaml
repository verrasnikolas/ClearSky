apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
    spec:
      containers:
        - name: stats-service
          image: stats-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002 # The port your stats service listens on
          env:
            - name: DB_HOST
              value: stats-postgres # Name of the PostgreSQL service for stats
            - name: DB_NAME
              value: stats_db
            - name: DB_USER
              value: stats_user
            - name: DB_PASSWORD
              value: "your_stats_db_password" # Replace with your actual password
            - name: DB_PORT
              value: "5432"
            - name: GRADES_SERVICE_URL
              value: "http://grades-service:3001/api/grades"
            - name: RABBITMQ_HOST
              value: "rabbitmq-service" # Assuming you have a RabbitMQ service
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_QUEUE
              value: "grades_queue"