apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
    spec:
      containers:
        - name: stats-service
          image: stats-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: GRADES_SERVICE_URL
              value: "http://grades-service:3001/api/grades"
            - name: DB_HOST
              value: "stats-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "stats_db"
            - name: DB_USER
              value: "stats_user"
            - name: DB_PASSWORD
              value: "1234"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: JWT_SECRET
              value: "super_secret"
            - name: TOKEN_EXPIRY
              value: "1h"
            - name: REFRESH_TOKEN_SECRET
              value: "refresh_secret"