apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stats-service
  template:
    metadata:
      labels:
        app: stats-service
    spec:
      containers:
        - name: stats-service
          image: stats-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002 # The port the stats service listens on
          env:
            - name: GRADES_SERVICE_URL
              value: http://grades-service:3001/api/grades