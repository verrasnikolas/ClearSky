apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
          env:
            - name: JWT_SECRET
              value: "super_secret"
            - name: TOKEN_EXPIRY
              value: "1h"
            - name: REFRESH_TOKEN_SECRET
              value: "refresh_secret"
