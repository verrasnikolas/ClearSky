apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: review-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: DB_HOST
              value: review-postgres
            - name: DB_NAME
              value: reviewdb
            - name: DB_USER
              value: postgres
            - name: DB_PASS
              value: "1234"
            - name: DB_PORT
              value: "5432"