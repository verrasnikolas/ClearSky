version: '3.8'

services:
  review-service:
    build: .
    ports:
      - '3003:3003'
    env_file: DEMO.env
    depends_on:
      - postgres
    restart: always
    volumes:
      - .:/app

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: reviewdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
