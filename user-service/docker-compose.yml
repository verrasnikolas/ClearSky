version: '3.8'

services:
  user-db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}  # θα είναι postgres (από το .env)
      POSTGRES_PASSWORD: ${DB_PASS}  # θα είναι root (από το .env)
      POSTGRES_DB: ${DB_NAME}  # usersdb
    ports:
      - "5432:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data

  user-service:
    build: .
    ports:
      - "3005:3005"
    depends_on:
      - user-db
    env_file:
      - .env
    environment:
      NODE_ENV: development

volumes:
  user_pgdata:
