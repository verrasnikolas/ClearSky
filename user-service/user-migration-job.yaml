apiVersion: batch/v1
kind: Job
metadata:
  name: user-db-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: your-dockerhub-username/user-service:latest # Use your User Service image
          command: ["npx"]
          args: ["sequelize-cli", "db:migrate"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: user-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-credentials
                  key: password
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: user-db-config
                  key: database
            - name: DB_HOST
              value: user-db # Matches the name of your PostgreSQL Service
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: user-db-config
                  key: port
            - name: NODE_ENV
              value: "development" # Or "production"
      restartPolicy: Never
  backoffLimit: 3