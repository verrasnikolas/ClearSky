apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest # Make sure your Docker image is tagged as user-service:latest or adjust accordingly
          imagePullPolicy: Never # Use 'IfNotPresent' if you push your image to a registry
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: DB_HOST
              value: "user-db-service" # Kubernetes Service name for the database
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ${DB_NAME}
            - name: DB_USER
              value: ${DB_USER}
            - name: DB_PASS
              value: ${DB_PASS}
            - name: JWT_SECRET
              value: ${JWT_SECRET}
            - name: TOKEN_EXPIRY
              value: ${TOKEN_EXPIRY}
            - name: REFRESH_TOKEN_SECRET
              value: ${REFRESH_TOKEN_SECRET}
            - name: USER_SERVICE_URL
              value: "http://user-service:3005" # Internal service URL
            - name: EMAIL_USER
              value: ${EMAIL_USER}
            - name: EMAIL_PASSWORD
              value: ${EMAIL_PASSWORD}
            - name: RABBITMQ_HOST
              value: "rabbitmq-service" # Kubernetes Service name for RabbitMQ
            - name: RABBITMQ_PORT
              value: "5672"
            - name: NODE_ENV
              value: "development"