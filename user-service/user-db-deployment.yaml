apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: postgres
          image: postgres:13
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ${DB_USER}
            - name: POSTGRES_PASSWORD
              value: ${DB_PASS}
            - name: POSTGRES_DB
              value: ${DB_NAME}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: user-db-storage
      volumes:
        - name: user-db-storage
          persistentVolumeClaim:
            claimName: user-db-pvc