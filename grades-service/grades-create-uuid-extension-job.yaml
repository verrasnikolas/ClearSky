apiVersion: batch/v1
kind: Job
metadata:
  name: grades-create-uuid-extension
spec:
  template:
    spec:
      containers:
        - name: extension-creator
          image: postgres:15
          env:
            - name: PGHOST
              value: grades-db
            - name: PGDATABASE
              value: gradesdb
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: "1234"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              until PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 5
              done
              echo "uuid-ossp extension created successfully."
      restartPolicy: Never
  backoffLimit: 3