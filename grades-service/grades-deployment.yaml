apiVersion: apps/v1
kind: Deployment
metadata:
  name: grades-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grades-service
  template:
    metadata:
      labels:
        app: grades-service
    spec:
      containers:
        - name: grades-service
          image: grades-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PGHOST
              value: grades-postgres
            - name: PGNAME
              value: gradesdb
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: "1234"
            - name: PGPORT
              value: "5432"