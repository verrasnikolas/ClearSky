apiVersion: apps/v1
kind: Deployment
metadata:
  name: grades-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grades-service
  template:
    metadata:
      labels:
        app: grades-service
    spec:
      containers:
        - name: grades-service
          image: grades-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: grades-db # This is the name of your Kubernetes Service for Postgres
            - name: DB_NAME
              value: "gradesdb"
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              value: "1234" # Replace with a Kubernetes Secret reference in production!
            - name: DB_PORT
              value: "5432"
            - name: NODE_ENV
              value: development
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASS
              value: "guest"
            - name: JWT_SECRET
              value: "super_secret"
            - name: TOKEN_EXPIRY
              value: "1h"
            - name: REFRESH_TOKEN_SECRET
              value: "refresh_secret"