apiVersion: apps/v1
kind: Deployment
metadata:
  name: grades-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grades-db
  template:
    metadata:
      labels:
        app: grades-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gradesdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: "1234"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: grades-db-storage
      volumes:
        - name: grades-db-storage
          persistentVolumeClaim:
            claimName: grades-db-pvc